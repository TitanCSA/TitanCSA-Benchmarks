name: Validate code and measured data
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_raw_hashes.py
      - run: python scripts/report.py
      - run: python scripts/xinput_report.py
      - run: python scripts/input_report.py
      - run: python scripts/joystick_report.py
      - run: python scripts/stability_report.py
      - run: python scripts/final_report.py
      - run: python scripts/etw_report.py
      - run: python scripts/diagnostic_charts.py
      - run: python scripts/archive_results.py
      - run: python -m mkdocs build --strict
      - run: python scripts/validate_site.py
  native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/prepare-sources.py
      - run: python scripts/prepare-vjoy-sdk.py
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release
      - name: Parse PowerShell scripts without execution
        shell: pwsh
        run: |
          $failed=$false
          Get-ChildItem automation -Filter *.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors){$failed=$true;$errors|ForEach-Object{Write-Error $_}}
          }
          if($failed){exit 1}
