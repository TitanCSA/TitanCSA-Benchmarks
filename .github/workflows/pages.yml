name: Publish validated benchmark site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_raw_hashes.py
      - run: python scripts/report.py
      - run: python scripts/xinput_report.py
      - run: python scripts/input_report.py
      - run: python scripts/joystick_report.py
      - run: python scripts/stability_report.py
      - run: python scripts/final_report.py
      - run: python scripts/etw_report.py
      - run: python scripts/diagnostic_charts.py
      - run: python scripts/archive_results.py
      - run: python -m mkdocs build --strict
      - run: python scripts/validate_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
