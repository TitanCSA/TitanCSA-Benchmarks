{% extends "base.html" %}
{% block extrahead %}
{% if page %}
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.meta.title | default(page.title) | e }} · TitanCSA Benchmarks">
<meta property="og:description" content="{{ page.meta.description | default(config.site_description) | e }}">
<meta property="og:url" content="{{ page.canonical_url | e }}">
<meta property="og:image" content="{{ config.site_url }}assets/hid-latency.png">
<meta name="twitter:card" content="summary_large_image">
{% if page.meta.published %}<meta property="article:published_time" content="{{ page.meta.published }}">{% endif %}
{% if page.meta.updated %}<meta property="article:modified_time" content="{{ page.meta.updated }}">{% endif %}
{% if page.meta.dataset %}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Dataset","name":"TitanCSA Windows 11 Hyper-V input benchmarks","description":"Measured virtual vendor HID and Xbox 360 input paths, with raw QPC timestamps, independent Windows receivers, provenance, failure records and explicit software-only measurement boundaries.","url":"{{ page.canonical_url }}","creator":{"@type":"Organization","name":"TitanCSA","url":"https://github.com/TitanCSA"},"license":"https://creativecommons.org/licenses/by/4.0/","datePublished":"2026-11-17","distribution":[{"@type":"DataDownload","encodingFormat":"application/zip","contentUrl":"{{ config.site_url }}assets/raw-results.zip"},{"@type":"DataDownload","encodingFormat":"application/json","contentUrl":"{{ config.site_url }}assets/results.json"}]}</script>
{% endif %}
{% endif %}
{% endblock %}
